task: Cifar10
synthesizer: Pattern


batch_size: 64
test_batch_size: 100
lr: 0.01
momentum: 0.9
decay: 0.0005
epochs: 50
poison_epoch: 10
poison_epoch_stop: 40
save_on_epochs: [20, 30, 40, 50]
optimizer: SGD
log_interval: 100

poisoning_proportion: 0.2
backdoor_label: 8

resume_model: #resume_model/model_epoch_200.pt.tar

save_model: True
log: True

transform_train: True

fl: True
fl_no_models: 10
fl_local_epochs: 2
fl_poison_epochs: 15
fl_total_participants: 100
fl_eta: 1
fl_sample_dirichlet: True
fl_dirichlet_alpha: 0.9

fl_number_of_adversaries: 2
fl_weight_scale: 5
fl_adv_group_size: 2

attack: ThrDFed
defense: FedAvgCKA
fl_num_neurons: 5
noise_mask_alpha: 0
lagrange_step: 0.1

# FedAvgCKA Defense Configuration
fedavgcka_enabled: true
fedavgcka_root_dataset_size: 64
fedavgcka_root_dataset_strategy: class_balanced  # 'random' or 'class_balanced'
fedavgcka_layer_comparison: penultimate  # 'penultimate', 'layer2', 'layer3', 'multi_layer'
fedavgcka_trim_fraction: 0.3  # Fraction of clients to exclude (30%)
fedavgcka_log_scores: true  # Enable detailed logging
